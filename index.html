<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>My Sites</title>
</head>
<body>
<header><div><h1>My Sites</h1><p>便利サイト図鑑 v0.8</p></div><button id="addTop" class="primary">＋ 登録</button></header>
<main>
  <input id="search" type="search" placeholder="サイト名・URL・タグ・メモを検索">
  <select id="categoryFilter"><option value="">すべてのカテゴリ</option><option>AI / 生成AI</option><option>画像</option><option>動画</option><option>音楽</option><option>学習</option><option>ニュース</option><option>開発</option><option>ツール</option><option>その他</option></select>
  <nav><button data-filter="all" class="active">すべて</button><button data-filter="favorite">★ お気に入り</button><button data-filter="later">あとで試す</button><button data-filter="recent">最近追加</button></nav>
  <p id="stats"></p><section id="list"></section>
  <aside>
    <div class="card" style="margin-top:12px"><strong>🤖 ChatGPT連携</strong><p>ChatGPTからの登録リンク、Safariの共有からのサイト追加に対応しています。</p></div>
    <button id="shareChanged">↗ ChatGPTに変更分を共有</button>
    <button id="shareAll">↗ ChatGPTに全データを共有</button>
    <button id="copyAll">📋 ChatGPT用データをコピー</button>
    <button id="copyPrompt">🤖 ChatGPT検索用プロンプトをコピー</button>
    <label>↓ JSONから復元<input id="importFile" type="file" accept=".json,application/json"></label>
  </aside>
</main>

<div id="modal" class="hidden"><div class="box">
  <div class="head"><h2 id="modalTitle">サイトを登録</h2><button id="close">×</button></div>
  <form id="form">
    <input id="id" type="hidden">
    <label>URL *<input id="url" type="url" required placeholder="https://example.com"></label>
    <label>サイト名 *<input id="name" required placeholder="サイト名"></label>
    <label>説明<textarea id="desc" rows="3"></textarea></label>
    <label>カテゴリ<select id="cat"><option>AI / 生成AI</option><option>画像</option><option>動画</option><option>音楽</option><option>学習</option><option>ニュース</option><option>開発</option><option>ツール</option><option>その他</option></select></label>
    <label>タグ<input id="tags" placeholder="AI, 無料, 動画生成"></label>
    <label>メモ<textarea id="memo" rows="3"></textarea></label>
    <div><label><input id="fav" type="checkbox"> ★ お気に入り</label><label><input id="later" type="checkbox"> あとで試す</label></div>
    <footer><button type="button" id="delete" class="danger hidden">削除</button><span></span><button type="button" id="cancel">キャンセル</button><button class="primary">保存</button></footer>
  </form>
</div></div>
<script src="app.js"></script>
</body></html>
